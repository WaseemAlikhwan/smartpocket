name: smartpocket
description: "Personal expense tracker — local-first, offline-ready."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  uuid: ^4.5.1
  fl_chart: ^0.69.2
  file_picker: ^8.3.7
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^17.2.3
  flutter_contacts: ^1.1.9+2
  pdf: ^3.11.3
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
